<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Asteroids</title><style>body{margin:0;overflow:hidden;background:#02040d;color:#dffaff;font:16px monospace}canvas{display:block;width:100vw;height:100vh}#h{position:fixed;inset:20px;pointer-events:none;text-shadow:0 0 9px #0df;letter-spacing:2px}#t{display:flex;justify-content:space-between}#o{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#03081799}.p{padding:28px;border:1px solid #3df;background:#071126dd;box-shadow:0 0 30px #08c8}h1{font-size:clamp(34px,8vw,80px);margin:0;color:#5ef;letter-spacing:10px;text-shadow:0 0 16px #0cf}button{padding:12px 22px;background:#5ef;border:0;font:bold 16px monospace;cursor:pointer}small{position:fixed;bottom:20px;width:100%;text-align:center;color:#9bd}</style></head><body><canvas id="c"></canvas><div id="h"><div id="t"><span id="s">SCORE 000000</span><span id="l">SHIPS 3</span><span id="w">WAVE 1</span></div><small>← → ROTATE · ↑ THRUST · SPACE FIRE</small></div><div id="o"><div class="p"><h1>ASTEROIDS</h1><p>NEON DRIFT EDITION</p><button id="b">START MISSION</button></div></div><script>let parts=[],shake=0,hit=0,combo=1,comboTime=0;function blast(X,Y,col,n=22){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*5;parts.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:18+Math.random()*26,col})}}let ac;let atlas=new Image();atlas.src='neon-asset-sheet-transparent.png';let c=document.querySelector('#c'),x=c.getContext('2d'),W,H,K={},ship,rs,bs,eb=[],score,lives,wave,go,last,stars=Array.from({length:180},()=>[Math.random(),Math.random(),Math.random()*2]);function size(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',size);size();addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);function rock(X,Y,z){let r=z*17+Math.random()*9,p=[];for(let i=0,n=7+Math.random()*5|0;i<n;i++)p.push([i/n*6.283,r*(.75+Math.random()*.3)]);return{x:X,y:Y,phase:Math.random()*6.28,vx:(Math.random()-.5)*(1.4-z*.2),vy:(Math.random()-.5)*(1.4-z*.2),z,r,p}}function beep(f,d,type='square',v=.05){if(!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function start(){ac??=new (window.AudioContext||window.webkitAudioContext)();score=0;lives=3;wave=1;combo=1;comboTime=0;go=1;ship={x:W/2,y:H/2,a:-1.57,vx:0,vy:0,cool:0,engine:0};newwave();o.style.display='none';last=performance.now();requestAnimationFrame(loop)}function newwave(){rs=[];bs=[];eb=[];for(let i=0;i<wave+3;i++){let a=Math.random()*6.28,d=Math.max(W,H)/2;rs.push(rock(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,3))}rs.forEach(r=>{r.vx*=1+wave*.09;r.vy*=1+wave*.09})}function loop(T){let d=Math.min(2,(T-last)/16.7);last=T;parts=parts.filter(p=>(p.x+=p.vx*d,p.y+=p.vy*d,p.t-=d)>0);shake=Math.max(0,shake-d);hit=Math.max(0,hit-d);comboTime=Math.max(0,comboTime-d);if(!comboTime)combo=1;if(K.ArrowLeft)ship.a-=.08*d;if(K.ArrowRight)ship.a+=.08*d;if(K.ArrowUp){ship.vx+=Math.cos(ship.a)*.16*d;ship.vy+=Math.sin(ship.a)*.16*d;if((ship.engine=(ship.engine||0)-d)<=0){beep(92,.07,'triangle',.025);ship.engine=7}}ship.x=(ship.x+ship.vx*d+W)%W;ship.y=(ship.y+ship.vy*d+H)%H;ship.vx*=.994;ship.vy*=.994;if(K.Space&&ship.cool<=0){bs.push({x:ship.x+Math.cos(ship.a)*11+Math.cos(ship.a+Math.PI/2)*7,y:ship.y+Math.sin(ship.a)*11+Math.sin(ship.a+Math.PI/2)*7,vx:Math.cos(ship.a)*11+ship.vx,vy:Math.sin(ship.a)*11+ship.vy,t:55});ship.cool=9;beep(760,.055,'square',.045)}ship.cool-=d;rs.forEach(r=>{r.phase+=d*.04;r.x=(r.x+r.vx*d+W)%W;r.y=(r.y+r.vy*d+H)%H;if(r.z==1){r.x=(r.x+Math.sin(r.phase)*.7*d+W)%W;r.y=(r.y+Math.cos(r.phase)*.7*d+H)%H}if(Math.random()<.0015*d*(1+wave*.12)){let a=Math.atan2(ship.y-r.y,ship.x-r.x);eb.push({x:r.x,y:r.y,vx:Math.cos(a)*(3+wave*.12),vy:Math.sin(a)*(3+wave*.12),t:150})}});eb=eb.filter(b=>(b.x=(b.x+b.vx*d+W)%W,b.y=(b.y+b.vy*d+H)%H,b.t-=d)>0);if(!hit&&(rs.some(r=>Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+13)||eb.some(b=>Math.hypot(b.x-ship.x,b.y-ship.y)<16))){blast(ship.x,ship.y,'#ff4ba6',45);combo=1;comboTime=0;beep(72,.38,'sawtooth',.09);shake=18;hit=100;lives--;if(lives<=0){go=0;document.querySelector('#o').innerHTML='<div class="p"><h1>GAME OVER</h1><p>FINAL SCORE '+String(score).padStart(6,'0')+'</p><button id="b">PLAY AGAIN</button></div>';document.querySelector('#o').style.display='grid';document.querySelector('#b').onclick=start;return}ship={x:W/2,y:H/2,a:-1.57,vx:0,vy:0,cool:20,engine:0};document.querySelector('#l').textContent='SHIPS '+lives;}bs=bs.filter(b=>(b.x=(b.x+b.vx*d+W)%W,b.y=(b.y+b.vy*d+H)%H,--b.t)>0);for(let i=bs.length-1;i>=0;i--)for(let j=rs.length-1;j>=0;j--)if(Math.hypot(bs[i].x-rs[j].x,bs[i].y-rs[j].y)<rs[j].r){let r=rs[j];blast(r.x,r.y,'#67efff',28);shake=7;combo=Math.min(5,combo+1);comboTime=150;score+=r.z*25*combo;beep(125+r.z*50,.13,'sawtooth',.055);if(r.z>1)rs.push(rock(r.x,r.y,r.z-1),rock(r.x,r.y,r.z-1));rs.splice(j,1);bs.splice(i,1);break}if(!rs.length){wave++;newwave()}draw();s.textContent='SCORE '+String(score).padStart(6,'0')+(combo>1?'  x'+combo:'');w.textContent='WAVE '+wave;if(go)requestAnimationFrame(loop)}function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);x.fillStyle='#030715';x.fillRect(0,0,W,H);stars.forEach(q=>{x.fillStyle='#bff';x.globalAlpha=.2+q[2]/4;x.fillRect(q[0]*W,q[1]*H,q[2],q[2])});x.globalAlpha=1;parts.forEach(p=>{x.globalAlpha=p.t/44;x.fillStyle=p.col;x.fillRect(p.x-2,p.y-2,4,4)});x.globalAlpha=1;if(!atlas.complete)rs.forEach(r=>{x.beginPath();r.p.forEach((p,i)=>i?x.lineTo(r.x+Math.cos(p[0])*p[1],r.y+Math.sin(p[0])*p[1]):x.moveTo(r.x+Math.cos(p[0])*p[1],r.y+Math.sin(p[0])*p[1]));x.closePath();x.strokeStyle='#7ef';x.shadowBlur=13;x.shadowColor='#0cf';x.stroke()});if(atlas.complete)rs.forEach(r=>{x.save();x.filter=r.z==3?'hue-rotate(270deg) saturate(1.6)':r.z==2?'hue-rotate(105deg) saturate(1.5)':'hue-rotate(30deg) saturate(1.9)';let stretch=r.z==1?1.35:r.z==2?.82:1;x.translate(r.x,r.y);x.rotate(r.z==1?r.phase*.25:0);x.drawImage(atlas,700,0,350,561,-r.r*stretch,-r.r,r.r*2*stretch,r.r*2);x.restore()});eb.forEach(b=>{x.fillStyle='#ff7a3c';x.shadowBlur=10;x.shadowColor='#ff4a22';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});bs.forEach(b=>{x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,3,0,7);x.fill()});if(!atlas.complete){x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.beginPath();x.moveTo(20,0);x.lineTo(-14,-12);x.lineTo(-8,0);x.lineTo(-14,12);x.closePath();x.strokeStyle='#f5c';x.shadowBlur=18;x.shadowColor='#f2a';x.stroke();x.restore();x.shadowBlur=0};if(atlas.complete){x.save();x.translate(ship.x,ship.y);x.rotate(ship.a+Math.PI/2);if(K.ArrowUp){x.fillStyle='#ff9b45';x.shadowBlur=16;x.shadowColor='#ff5c2e';x.beginPath();x.moveTo(-2,20);x.lineTo(7,38+Math.random()*9);x.lineTo(16,20);x.closePath();x.fill();x.fillStyle='#fff4a8';x.beginPath();x.moveTo(3,20);x.lineTo(7,30+Math.random()*4);x.lineTo(11,20);x.fill()}x.drawImage(atlas,0,0,350,561,-25,-25,50,50);x.restore()}x.restore()}b.onclick=start;draw()</script></body></html>
